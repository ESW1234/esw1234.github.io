<html>
<head>
  <title>cwc_auth_1.html</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
</head>
<body>

	<button type="button" onclick="fetchAndSetIdentityToken()">setIdentityToken</button><br/><br/>
	<button type="button" onclick="clearSession()">clearSession</button>

<script type='text/javascript'>
	async function fetchAndSetIdentityToken() {
		const identityTokenData = await fetchIdentityToken();
		embeddedservice_bootstrap.userVerificationAPI.setIdentityToken({
			identityTokenType: "JWT",
			identityToken: identityTokenData.accessToken
		});
	}

	function fetchIdentityToken() {
		const porticoURL = "https://portico.sfproxy.controltelemetry.aws-dev2-uswest2.aws.sfdc.cl/api/v1/miaw/getJwtToken?issuer=testIssuer&subject=testSubject2@cwc.com&jwtExpInSeconds=6000&keyId=5f103f1b-ee38-404c-ac94-83c427764813";
		return fetch(porticoURL).then(function(response) {
			return response.json();
		});
	}

	function clearSession() {
		embeddedservice_bootstrap.userVerificationAPI.clearSession(true);
	}

	window.addEventListener("onEmbeddedMessagingReady", () => {
		 console.log("Received the onEmbeddedMessagingReady event…");
		 const chatActive = localStorage.getItem("chatActive");
		 if (chatActive) {
			 embeddedservice_bootstrap.userVerificationAPI
		    .clearSession(true)
		    .then(() => {
		      console.log("clearSession success");
		    })
		    .catch((error) => {
		      console.log("clearSession error: " + error);
		    })
		    .finally(() => {
		      localStorage.removeItem("chatActive");
		    });
			 
		 }
		
	});

	window.addEventListener("onEmbeddedMessagingConversationOpened", () => {
		 localStorage.setItem("chatActive", true);
	});


	window.addEventListener("onEmbeddedMessagingIdentityTokenExpired", () => {
		 console.log("Received the onEmbeddedMessagingTokenExpired event…");
		 // fetchAndSetIdentityToken();
	});
</script>

<script type='text/javascript'>
	function initEmbeddedMessaging() {
		try {
			embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'
			embeddedservice_bootstrap.settings.devMode = true;

			embeddedservice_bootstrap.init(
				'00DoB000000ljzO',
				'CWC_Auth_1',
				'https://orgfarm-20bf165a71.test2.my.pc-rnd.site.com/ESWCWCAuth11774904606539',
				{
					scrt2URL: 'https://orgfarm-20bf165a71.test2.my.pc-rnd.salesforce-scrt.com'
				}
			);
		} catch (err) {
			console.error('Error loading Embedded Messaging: ', err);
		}
	};
</script>
<script type='text/javascript' src='https://orgfarm-20bf165a71.test2.my.pc-rnd.site.com/ESWCWCAuth11774904606539/assets/js/init.js' onload='initEmbeddedMessaging()'></script>


</body>
</html>
