<html>
<head>
  <title>prod cwc_auth_1.html </title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
</head>
<body>

	<button type="button" onclick="fetchAndSetToken()">setIdentityToken</button><br/><br/>
	<button type="button" onclick="clearSession()">clearSession</button>

<script type='text/javascript'>
		function fetchAndSetToken() {
			 const subject = localStorage.getItem("activeUser");
		     var porticoURL = "https://portico.sfproxy.controltelemetry.aws-dev2-uswest2.aws.sfdc.cl/api/v1/miaw/getJwtToken?issuer=testIssuer&subject=" + subject + "&jwtExpInSeconds=6000&keyId=5f103f1b-ee38-404c-ac94-83c427764813";
		     fetch(porticoURL).then(function(response) {
			  return response.json();
		     }).then(function(data) {
			  embeddedservice_bootstrap.userVerificationAPI.setIdentityToken({
			       identityTokenType: "JWT",
			       identityToken: data.accessToken
			  });
		     }).catch(function(err) {
			  console.log('Fetch Error :', err);
		     });
		}

		function clearSession() {
			embeddedservice_bootstrap.userVerificationAPI.clearSession(true);
		}

		const isSessionCleared = false;

		window.addEventListener("onEmbeddedMessagingReady", async () => {
		    console.log("Received the once onEmbeddedMessagingReady event…");
			if (!isSessionCleared) {
				await embeddedservice_bootstrap.userVerificationAPI.clearSession(true);
				isSessionCleared = true;
			}
			fetchAndSetToken();
		});

		window.addEventListener("onEmbeddedMessagingReady", async () => {
		    console.log("Received the onEmbeddedMessagingReady event…");
			fetchAndSetToken();
		});

		window.addEventListener("onEmbeddedMessagingButtonCreated", () => {
			 console.log("Received the onEmbeddedMessagingButtonCreated event…");
		});


		window.addEventListener("onEmbeddedMessagingIdentityTokenExpired", () => {
		     console.log("Received the onEmbeddedMessagingTokenExpired event…");
		     // fetchAndSetToken();
		});
</script>

<script type='text/javascript'>
	function initEmbeddedMessaging() {
		try {
			embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'
      embeddedservice_bootstrap.settings.devMode = true;

			embeddedservice_bootstrap.init(
				'00Dg800000DfF8T',
				'cwc_auth_1',
				'https://trailsignup-9d3ad5784c6304.demo.my.site.com/ESWcwcauth11787100893692',
				{
					scrt2URL: 'https://trailsignup-9d3ad5784c6304.demo.my.salesforce-scrt.com'
				}
			);
		} catch (err) {
			console.error('Error loading Embedded Messaging: ', err);
		}
	};
</script>
<script type='text/javascript' src='https://trailsignup-9d3ad5784c6304.demo.my.site.com/ESWcwcauth11787100893692/assets/js/init.js' onload='initEmbeddedMessaging()'></script>

</body>
